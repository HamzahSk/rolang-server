# Disposable real databases; no production credentials or persistent volumes.
services:
  mongo:
    image: mongo:8.0
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all", "--setParameter", "enableTestCommands=1"]
    ports: ["127.0.0.1:27027:27017"]
    tmpfs: ["/data/db"]
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "try { if (!db.hello().isWritablePrimary) { quit(1); } } catch (e) { quit(1); }"
      interval: 2s
      timeout: 5s
      retries: 30
  mongo-init:
    image: mongo:8.0
    depends_on: [mongo]
    entrypoint: ["bash", "-c"]
    command:
      - "until mongosh --host mongo:27017 --quiet --eval 'db.adminCommand({ping:1})' >/dev/null 2>&1; do sleep 1; done; mongosh --host mongo:27017 --quiet --eval 'try { rs.status(); } catch (e) { rs.initiate({_id:\"rs0\",members:[{_id:0,host:\"localhost:27017\"}]}); }'"
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: rolang_test
      POSTGRES_PASSWORD: local-test-password
      POSTGRES_DB: rolang_test
    ports: ["127.0.0.1:54329:5432"]
    tmpfs: ["/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rolang_test -d rolang_test"]
      interval: 2s
      timeout: 5s
      retries: 30
